# Task 6 + Task 12 — three-platform internal CI.
# Builds the canonical product from vincent-lxc/opsmate at the locked commit
# (release/source-lock.json). Does not create public releases, apply code identity,
# or read private tokens other than OPSMATE_SOURCE_TOKEN for product checkout.
name: desktop-ci

on:
  push:
    branches: [main, feat/secure-desktop-foundation, ci/release-explicit-repo]
  pull_request:
    branches: [main, feat/secure-desktop-foundation, ci/release-explicit-repo]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin must match Cargo.toml rust-version and gate REQUIRED_RUST_VERSION.
  RUST_VERSION: "1.92.0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-14
            os: macos-14
            platform: macos
          - name: windows-2025
            os: windows-2025
            platform: windows
          - name: ubuntu-24.04
            os: ubuntu-24.04
            platform: linux

    steps:
      - name: Checkout release orchestrator
        # actions/checkout@v7 (Node 24 runtime; pin full SHA — no floating @v4 Node 20)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # actions/setup-node@v7 (Node 24 action runtime; app engines still node-version 22.22.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install Rust ${{ env.RUST_VERSION }}
        # Pinned full commit SHA for refs/heads/1.92.0 (not a tag; not @master).
        # Proof: git ls-remote https://github.com/dtolnay/rust-toolchain.git 1.92.0
        #   → 87eb139fed4b08a67bd1fa429a21d1f5d523e03e  refs/heads/1.92.0
        # This action release hardcodes 1.92.0 — do NOT pass with.toolchain (unexpected input).
        uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Ubuntu Tauri system packages
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: npm ci (release orchestrator gates)
        run: npm ci

      - name: npm test (release orchestrator gates)
        run: npm test

      - name: contracts check
        run: npm run contracts:check

      - name: Read canonical source lock
        id: source
        shell: bash
        run: node scripts/read-source-lock.mjs >> "$GITHUB_OUTPUT"

      - name: Checkout canonical OpsMate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: vincent-lxc/opsmate
          ref: ${{ steps.source.outputs.commit }}
          token: ${{ secrets.OPSMATE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false

      - name: Record source commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Canonical product: ${{ steps.source.outputs.repository }}@${{ steps.source.outputs.commit }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Cargo
        # actions/cache@v6 (Node 24 action runtime; pin full SHA)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            source/apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-product-1.92.0-${{ hashFiles('source/apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-product-1.92.0-

      - name: Admin npm ci / test / build
        working-directory: source/apps/admin
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build

      - name: Desktop npm ci
        working-directory: source/apps/desktop
        run: npm ci

      - name: cargo fmt
        run: cargo fmt --manifest-path source/apps/desktop/src-tauri/Cargo.toml -- --check

      - name: cargo clippy (strict)
        run: >
          cargo clippy --manifest-path source/apps/desktop/src-tauri/Cargo.toml
          --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path source/apps/desktop/src-tauri/Cargo.toml --all-targets

      - name: Ensure macOS dual Apple targets (universal)
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version | grep -F "1.92.0"

      - name: Tauri build (macOS universal-apple-darwin + dmg only)
        if: matrix.platform == 'macos'
        working-directory: source/apps/desktop
        run: |
          set -euo pipefail
          rustc --version | grep -F "1.92.0"
          # Explicit --bundles dmg: global tauri.conf targets must not pull nsis/appimage/deb on macOS.
          npm run tauri -- build --target universal-apple-darwin --bundles dmg

      - name: Tauri build (Windows NSIS)
        if: matrix.platform == 'windows'
        working-directory: source/apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          rustc --version | grep -F "1.92.0"
          npm run tauri -- build --bundles nsis

      - name: Tauri build (Linux AppImage + deb)
        if: matrix.platform == 'linux'
        working-directory: source/apps/desktop
        run: |
          set -euo pipefail
          rustc --version | grep -F "1.92.0"
          npm run tauri -- build --bundles appimage,deb

      - name: Upload internal-unsigned macOS artifacts
        if: matrix.platform == 'macos'
        # actions/upload-artifact@v7 (Node 24 action runtime; pin full SHA)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opsmate-macos-internal-unsigned
          path: |
            source/apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*
          if-no-files-found: error
          retention-days: 3

      - name: Upload internal-unsigned Windows NSIS artifacts
        if: matrix.platform == 'windows'
        # actions/upload-artifact@v7 (Node 24 action runtime; pin full SHA)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opsmate-windows-internal-unsigned
          path: |
            source/apps/desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 3

      - name: Upload internal-unsigned Linux AppImage + deb artifacts
        if: matrix.platform == 'linux'
        # actions/upload-artifact@v7 (Node 24 action runtime; pin full SHA)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opsmate-linux-internal-unsigned
          path: |
            source/apps/desktop/src-tauri/target/release/bundle/appimage/*
            source/apps/desktop/src-tauri/target/release/bundle/deb/*
          if-no-files-found: error
          retention-days: 3
