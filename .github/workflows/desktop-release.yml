# Task 8 + Task 12 — protected signed desktop release (tag desktop-v* only).
# Builds the canonical product from vincent-lxc/opsmate at release/source-lock.json.
# Reads signing secrets only from GitHub Environment desktop-release.
# Does not use continue-on-error; no secrets expressions inside run: scripts.
name: desktop-release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.92.0"
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-14
    environment: desktop-release
    # Propagate locked product source identity to the checkout-free release job.
    outputs:
      source_repository: ${{ steps.source.outputs.repository }}
      source_commit: ${{ steps.source.outputs.commit }}
    env:
      # Apple signing — mapped via env only (never in run: scripts).
      # Notarization credentials are scoped to the explicit notarytool steps below
      # so Tauri cannot hide an unbounded notarization wait inside `tauri build`.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - name: Checkout release orchestrator
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # actions/setup-node@v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install Rust 1.92.0
        # dtolnay/rust-toolchain@87eb139… (1.92.0); do not pass with.toolchain
        uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: npm ci (release orchestrator gates)
        run: npm ci

      - name: npm test (release orchestrator gates)
        run: npm test

      - name: contracts check
        run: npm run contracts:check

      - name: Read canonical source lock
        id: source
        shell: bash
        run: node scripts/read-source-lock.mjs >> "$GITHUB_OUTPUT"

      - name: Checkout canonical OpsMate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: vincent-lxc/opsmate
          ref: ${{ steps.source.outputs.commit }}
          token: ${{ secrets.OPSMATE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false

      - name: Record source commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Canonical product: ${{ steps.source.outputs.repository }}@${{ steps.source.outputs.commit }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Cargo
        # actions/cache@v6
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            source/apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-release-product-1.92.0-${{ hashFiles('source/apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-product-1.92.0-

      - name: Admin npm ci / test / build
        working-directory: source/apps/admin
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build

      - name: Desktop npm ci
        working-directory: source/apps/desktop
        run: npm ci

      - name: cargo fmt
        run: cargo fmt --manifest-path source/apps/desktop/src-tauri/Cargo.toml -- --check

      - name: cargo clippy (strict)
        run: >
          cargo clippy --manifest-path source/apps/desktop/src-tauri/Cargo.toml
          --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path source/apps/desktop/src-tauri/Cargo.toml --all-targets

      - name: Ensure macOS dual Apple targets
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version | grep -F "1.92.0"

      - name: Tauri build signed universal DMG (no automatic notarization)
        timeout-minutes: 45
        working-directory: source/apps/desktop
        # Certificate env vars drive Tauri codesigning. Notarization credentials
        # are deliberately absent so this step cannot wait on Apple's service.
        run: |
          set -euo pipefail
          rustc --version | grep -F "1.92.0"
          npm run tauri -- build --target universal-apple-darwin --bundles dmg

      - name: Submit DMG to Apple notarization
        id: notarization_submission
        timeout-minutes: 10
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG="$(find source/apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -1)"
          test -n "$DMG"
          SUBMIT_JSON="$RUNNER_TEMP/notary-submit.json"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json > "$SUBMIT_JSON"
          SUBMISSION_ID="$(plutil -extract id raw -o - "$SUBMIT_JSON")"
          test -n "$SUBMISSION_ID"
          echo "Apple notarization submission: $SUBMISSION_ID"
          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"
          echo "Apple notarization submission: $SUBMISSION_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Apple notarization
        timeout-minutes: 35
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZATION_SUBMISSION_ID: ${{ steps.notarization_submission.outputs.submission_id }}
        run: |
          set -euo pipefail
          WAIT_JSON="$RUNNER_TEMP/notary-wait.json"
          if ! xcrun notarytool wait "$APPLE_NOTARIZATION_SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --timeout 30m \
            --output-format json > "$WAIT_JSON"; then
            xcrun notarytool log "$APPLE_NOTARIZATION_SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi
          STATUS="$(plutil -extract status raw -o - "$WAIT_JSON")"
          echo "Apple notarization status: $STATUS"
          test "$STATUS" = "Accepted"

      - name: Staple notarization ticket to DMG
        run: |
          set -euo pipefail
          DMG="$(find source/apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -1)"
          test -n "$DMG"
          xcrun stapler staple "$DMG"

      - name: codesign verify
        run: |
          set -euo pipefail
          DMG="$(find source/apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -1)"
          test -n "$DMG"
          MOUNT_DIR="$(mktemp -d "$RUNNER_TEMP/opsmate-dmg.XXXXXX")"
          cleanup_mount() {
            hdiutil detach "$MOUNT_DIR" -quiet || true
            rmdir "$MOUNT_DIR" || true
          }
          trap cleanup_mount EXIT
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT_DIR"
          APP="$(find "$MOUNT_DIR" -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: spctl Gatekeeper assess
        run: |
          set -euo pipefail
          DMG="$(find source/apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -1)"
          test -n "$DMG"
          spctl --assess --type install --verbose=4 "$DMG"

      - name: stapler validate DMG
        run: |
          set -euo pipefail
          DMG="$(find source/apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -1)"
          test -n "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload macOS signed notarized artifact
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opsmate-macos-signed-notarized
          path: source/apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  # Temporarily disabled for desktop-v0.1.1; keep the reviewed SignPath path intact.
  windows:
    if: ${{ false }}
    runs-on: windows-2025
    environment: desktop-release
    steps:
      - name: Checkout release orchestrator
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # actions/setup-node@v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install Rust 1.92.0
        # dtolnay/rust-toolchain@87eb139… (1.92.0)
        uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e
        with:
          components: rustfmt, clippy

      - name: npm ci (release orchestrator gates)
        shell: bash
        run: npm ci

      - name: npm test (release orchestrator gates)
        shell: bash
        run: npm test

      - name: contracts check
        shell: bash
        run: npm run contracts:check

      - name: Read canonical source lock
        id: source
        shell: bash
        run: node scripts/read-source-lock.mjs >> "$GITHUB_OUTPUT"

      - name: Checkout canonical OpsMate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: vincent-lxc/opsmate
          ref: ${{ steps.source.outputs.commit }}
          token: ${{ secrets.OPSMATE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false

      - name: Cache Cargo
        # actions/cache@v6
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            source/apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-release-product-1.92.0-${{ hashFiles('source/apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-product-1.92.0-

      - name: Admin npm ci / test / build
        working-directory: source/apps/admin
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build

      - name: Desktop npm ci
        working-directory: source/apps/desktop
        shell: bash
        run: npm ci

      - name: cargo fmt
        shell: bash
        run: cargo fmt --manifest-path source/apps/desktop/src-tauri/Cargo.toml -- --check

      - name: cargo clippy (strict)
        shell: bash
        run: >
          cargo clippy --manifest-path source/apps/desktop/src-tauri/Cargo.toml
          --all-targets --all-features -- -D warnings

      - name: cargo test
        shell: bash
        run: cargo test --manifest-path source/apps/desktop/src-tauri/Cargo.toml --all-targets

      - name: Tauri build unsigned NSIS
        working-directory: source/apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          rustc --version | grep -F "1.92.0"
          npm run tauri -- build --bundles nsis

      - name: Upload unsigned NSIS
        id: unsigned_nsis
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-unsigned-nsis
          path: source/apps/desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 3

      - name: SignPath submit signing request
        # SignPath action v2 pin (commit SHA below is the v2 line).
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned_nsis.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-output

      - name: Verify Authenticode Valid on signed output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path 'signed-output' -Recurse -Filter '*.exe' -File
          if (-not $files -or $files.Count -lt 1) {
            throw 'No signed .exe under signed-output'
          }
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature -FilePath $f.FullName
            if ($s.Status -ne 'Valid') {
              throw "Authenticode not Valid for $($f.FullName): $($s.Status)"
            }
          }

      - name: Upload Windows signed artifact
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opsmate-windows-signed
          path: signed-output
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-24.04
    # Propagate locked product source identity to the checkout-free release job.
    outputs:
      source_repository: ${{ steps.source.outputs.repository }}
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Checkout release orchestrator
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # actions/setup-node@v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install Rust 1.92.0
        # dtolnay/rust-toolchain@87eb139… (1.92.0)
        uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e
        with:
          components: rustfmt, clippy

      - name: Install Ubuntu Tauri system packages
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: npm ci (release orchestrator gates)
        run: npm ci

      - name: npm test (release orchestrator gates)
        run: npm test

      - name: contracts check
        run: npm run contracts:check

      - name: Read canonical source lock
        id: source
        shell: bash
        run: node scripts/read-source-lock.mjs >> "$GITHUB_OUTPUT"

      - name: Checkout canonical OpsMate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: vincent-lxc/opsmate
          ref: ${{ steps.source.outputs.commit }}
          token: ${{ secrets.OPSMATE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false

      - name: Record source commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Canonical product: ${{ steps.source.outputs.repository }}@${{ steps.source.outputs.commit }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Cargo
        # actions/cache@v6
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            source/apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-release-product-1.92.0-${{ hashFiles('source/apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-product-1.92.0-

      - name: Admin npm ci / test / build
        working-directory: source/apps/admin
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build

      - name: Desktop npm ci
        working-directory: source/apps/desktop
        run: npm ci

      - name: cargo fmt
        run: cargo fmt --manifest-path source/apps/desktop/src-tauri/Cargo.toml -- --check

      - name: cargo clippy (strict)
        run: >
          cargo clippy --manifest-path source/apps/desktop/src-tauri/Cargo.toml
          --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path source/apps/desktop/src-tauri/Cargo.toml --all-targets

      - name: Tauri build AppImage and deb
        working-directory: source/apps/desktop
        run: |
          set -euo pipefail
          rustc --version | grep -F "1.92.0"
          npm run tauri -- build --bundles appimage,deb

      - name: Upload Linux release artifact
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opsmate-linux-release
          path: |
            source/apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            source/apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    # Checkout-free publish job (contents: write). Source identity comes from
    # build-job outputs — never OPSMATE_SOURCE_TOKEN or product checkout here.
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    environment: desktop-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download macOS signed notarized
        # actions/download-artifact@v8.0.1 (using: node24; pin full tag commit SHA)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: opsmate-macos-signed-notarized
          path: opsmate-macos-signed-notarized

      - name: Download Linux release
        # actions/download-artifact@v8.0.1 (using: node24; pin full tag commit SHA)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: opsmate-linux-release
          path: opsmate-linux-release

      # Flatten nested artifact trees (Linux keeps appimage/ + deb/; macOS may nest too).
      # Never pass directories to sha256sum/gh; copy regular files only with collision detection.
      - name: Stage release assets (recursive, fail-closed)
        run: |
          set -euo pipefail
          STAGE_DIR="release-assets"
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}"

          stage_platform() {
            local root="$1"
            local platform="$2"
            local count=0
            if [[ ! -d "${root}" ]]; then
              echo "missing artifact root: ${root}" >&2
              exit 1
            fi
            # Deterministic walk: sorted paths, regular files only (no dirs / symlinks as assets).
            while IFS= read -r -d '' f; do
              case "${platform}:${f}" in
                macos:*.dmg|linux:*.AppImage|linux:*.deb) ;;
                *) continue ;;
              esac
              local base
              base="$(basename -- "${f}")"
              local dest="${STAGE_DIR}/${base}"
              if [[ -e "${dest}" ]]; then
                echo "collision: ${base} already staged (from ${f})" >&2
                exit 1
              fi
              cp -p -- "${f}" "${dest}"
              count=$((count + 1))
            done < <(find "${root}" -type f -print0 | sort -z)
            if [[ "${count}" -lt 1 ]]; then
              echo "no regular files under ${root}" >&2
              exit 1
            fi
            echo "staged ${count} file(s) from ${root}"
          }

          stage_platform "opsmate-macos-signed-notarized" macos
          stage_platform "opsmate-linux-release" linux

      - name: Compute SHA256SUMS
        run: |
          set -euo pipefail
          # Sorted regular files only under release-assets (never one-level platform globs).
          mapfile -d '' -t files < <(find release-assets -type f -print0 | sort -z)
          if [[ "${#files[@]}" -lt 1 ]]; then
            echo "release-assets empty" >&2
            exit 1
          fi
          sha256sum -- "${files[@]}" > SHA256SUMS
          test -s SHA256SUMS

      - name: Create GitHub pre-release
        env:
          # Propagated from build jobs (same lock); never read OPSMATE_SOURCE_TOKEN here.
          SOURCE_REPOSITORY: ${{ needs.macos.outputs.source_repository }}
          SOURCE_COMMIT: ${{ needs.macos.outputs.source_commit }}
          SOURCE_REPOSITORY_LINUX: ${{ needs.linux.outputs.source_repository }}
          SOURCE_COMMIT_LINUX: ${{ needs.linux.outputs.source_commit }}
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(find release-assets -type f -print0 | sort -z)
          if [[ "${#files[@]}" -lt 1 ]]; then
            echo "release-assets empty" >&2
            exit 1
          fi
          # Fail closed if macos/linux disagree on the locked product commit.
          if [[ -z "${SOURCE_REPOSITORY}" || -z "${SOURCE_COMMIT}" ]]; then
            echo "missing macos source outputs" >&2
            exit 1
          fi
          if [[ "${SOURCE_REPOSITORY}" != "${SOURCE_REPOSITORY_LINUX}" || "${SOURCE_COMMIT}" != "${SOURCE_COMMIT_LINUX}" ]]; then
            echo "macos/linux source lock outputs disagree" >&2
            exit 1
          fi
          NOTES="$(printf '%s\n' \
            "OpsMate Desktop pre-release $GITHUB_REF_NAME (signed and notarized macOS DMG; Linux AppImage+deb; Windows is not included)." \
            "" \
            "Canonical product source: \`${SOURCE_REPOSITORY}@${SOURCE_COMMIT}\` (from \`release/source-lock.json\` on build jobs)." \
            "Product build paths: \`source/apps/admin\` + \`source/apps/desktop\` only." \
          )"
          echo "$NOTES" >> "$GITHUB_STEP_SUMMARY"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES" \
            --prerelease \
            -- \
            "${files[@]}" \
            SHA256SUMS
