# Task 8 — protected signed desktop release (tag desktop-v* only).
# Reads signing secrets only from GitHub Environment desktop-release.
# Does not use continue-on-error; no secrets expressions inside run: scripts.
name: desktop-release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.92.0"
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-14
    environment: desktop-release
    env:
      # Apple signing / notarization — mapped via env only (never in run: scripts).
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install Rust 1.92.0
        # dtolnay/rust-toolchain@87eb139… (1.92.0); do not pass with.toolchain
        uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        # actions/cache@v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-release-1.92.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-1.92.0-

      - name: npm ci
        run: npm ci

      - name: npm test
        run: npm test

      - name: contracts check
        run: npm run contracts:check

      - name: npm run build:web
        run: npm run build:web

      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: cargo clippy (strict)
        run: >
          cargo clippy --manifest-path src-tauri/Cargo.toml
          --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Ensure macOS dual Apple targets
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version | grep -F "1.92.0"

      - name: Tauri build signed universal DMG
        # APPLE_* env vars drive Tauri automatic codesign + notarization.
        run: |
          set -euo pipefail
          rustc --version | grep -F "1.92.0"
          npm run tauri -- build --target universal-apple-darwin --bundles dmg

      - name: codesign verify
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name '*.app' -type d | head -1)"
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: spctl Gatekeeper assess
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name '*.app' -type d | head -1)"
          test -n "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: stapler validate DMG
        run: |
          set -euo pipefail
          DMG="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -1)"
          test -n "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload macOS signed notarized artifact
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opsmate-macos-signed-notarized
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2025
    environment: desktop-release
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install Rust 1.92.0
        # dtolnay/rust-toolchain@87eb139… (1.92.0)
        uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        # actions/cache@v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-release-1.92.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-1.92.0-

      - name: npm ci
        shell: bash
        run: npm ci

      - name: npm test
        shell: bash
        run: npm test

      - name: contracts check
        shell: bash
        run: npm run contracts:check

      - name: npm run build:web
        shell: bash
        run: npm run build:web

      - name: cargo fmt
        shell: bash
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: cargo clippy (strict)
        shell: bash
        run: >
          cargo clippy --manifest-path src-tauri/Cargo.toml
          --all-targets --all-features -- -D warnings

      - name: cargo test
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Tauri build unsigned NSIS
        shell: bash
        run: |
          set -euo pipefail
          rustc --version | grep -F "1.92.0"
          npm run tauri -- build --bundles nsis

      - name: Upload unsigned NSIS
        id: unsigned_nsis
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-unsigned-nsis
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 3

      - name: SignPath submit signing request
        # SignPath action v2 pin (commit SHA below is the v2 line).
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned_nsis.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-output

      - name: Verify Authenticode Valid on signed output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path 'signed-output' -Recurse -Filter '*.exe' -File
          if (-not $files -or $files.Count -lt 1) {
            throw 'No signed .exe under signed-output'
          }
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature -FilePath $f.FullName
            if ($s.Status -ne 'Valid') {
              throw "Authenticode not Valid for $($f.FullName): $($s.Status)"
            }
          }

      - name: Upload Windows signed artifact
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opsmate-windows-signed
          path: signed-output
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install Rust 1.92.0
        # dtolnay/rust-toolchain@87eb139… (1.92.0)
        uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        # actions/cache@v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-release-1.92.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-1.92.0-

      - name: Install Ubuntu Tauri system packages
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: npm ci
        run: npm ci

      - name: npm test
        run: npm test

      - name: contracts check
        run: npm run contracts:check

      - name: npm run build:web
        run: npm run build:web

      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: cargo clippy (strict)
        run: >
          cargo clippy --manifest-path src-tauri/Cargo.toml
          --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Tauri build AppImage and deb
        run: |
          set -euo pipefail
          rustc --version | grep -F "1.92.0"
          npm run tauri -- build --bundles appimage,deb

      - name: Upload Linux release artifact
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opsmate-linux-release
          path: |
            src-tauri/target/release/bundle/appimage/*
            src-tauri/target/release/bundle/deb/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    environment: desktop-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download macOS signed notarized
        # actions/download-artifact@v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: opsmate-macos-signed-notarized
          path: opsmate-macos-signed-notarized

      - name: Download Windows signed
        # actions/download-artifact@v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: opsmate-windows-signed
          path: opsmate-windows-signed

      - name: Download Linux release
        # actions/download-artifact@v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: opsmate-linux-release
          path: opsmate-linux-release

      # Flatten nested artifact trees (Linux keeps appimage/ + deb/; Mac/Windows may nest too).
      # Never pass directories to sha256sum/gh; copy regular files only with collision detection.
      - name: Stage release assets (recursive, fail-closed)
        run: |
          set -euo pipefail
          STAGE_DIR="release-assets"
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}"

          stage_platform() {
            local root="$1"
            local count=0
            if [[ ! -d "${root}" ]]; then
              echo "missing artifact root: ${root}" >&2
              exit 1
            fi
            # Deterministic walk: sorted paths, regular files only (no dirs / symlinks as assets).
            while IFS= read -r -d '' f; do
              local base
              base="$(basename -- "${f}")"
              local dest="${STAGE_DIR}/${base}"
              if [[ -e "${dest}" ]]; then
                echo "collision: ${base} already staged (from ${f})" >&2
                exit 1
              fi
              cp -p -- "${f}" "${dest}"
              count=$((count + 1))
            done < <(find "${root}" -type f -print0 | sort -z)
            if [[ "${count}" -lt 1 ]]; then
              echo "no regular files under ${root}" >&2
              exit 1
            fi
            echo "staged ${count} file(s) from ${root}"
          }

          stage_platform "opsmate-macos-signed-notarized"
          stage_platform "opsmate-windows-signed"
          stage_platform "opsmate-linux-release"

      - name: Compute SHA256SUMS
        run: |
          set -euo pipefail
          # Sorted regular files only under release-assets (never one-level platform globs).
          mapfile -d '' -t files < <(find release-assets -type f -print0 | sort -z)
          if [[ "${#files[@]}" -lt 1 ]]; then
            echo "release-assets empty" >&2
            exit 1
          fi
          sha256sum -- "${files[@]}" > SHA256SUMS
          test -s SHA256SUMS

      - name: Create GitHub pre-release
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(find release-assets -type f -print0 | sort -z)
          if [[ "${#files[@]}" -lt 1 ]]; then
            echo "release-assets empty" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "OpsMate Desktop pre-release $GITHUB_REF_NAME (signed macOS/Windows; Linux AppImage+deb)." \
            --prerelease \
            -- \
            "${files[@]}" \
            SHA256SUMS
