[package]
name = "opsmate-desktop"
version = "0.1.0"
description = "OpsMate Desktop — independent secure client shell"
authors = ["OpsMate"]
edition = "2021"
rust-version = "1.92"
license = "LicenseRef-Proprietary"

[lib]
name = "opsmate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# Exact pins aligned with ops-ai apps/desktop (foundation: no opener/stronghold plugins yet)
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
