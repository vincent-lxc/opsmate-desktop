[package]
name = "opsmate-desktop"
version = "0.1.0"
description = "OpsMate Desktop — independent secure client shell"
authors = ["OpsMate"]
edition = "2021"
rust-version = "1.92"
license = "LicenseRef-Proprietary"

[lib]
name = "opsmate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# Exact pins aligned with ops-ai apps/desktop where overlapping.
# Task 5: Logto PKCE + system browser + deep-link (Rust-owned; no WebView perms).
tauri = { version = "=2.11.5", features = [] }
# System browser for authorize URL only — capabilities must NOT grant opener to WebView.
tauri-plugin-opener = "=2.5.4"
# OS deep-link delivery of opsmate://auth/callback — Rust handler only.
tauri-plugin-deep-link = "=2.4.9"
# Task 8A1: Stronghold library only — NEVER register plugin or grant WebView capability.
tauri-plugin-stronghold = "=2.3.1"
# Private-key parse + fingerprint (no ssh2).
russh = "=0.62.5"
# Native PEM file picker (macOS secure prompts use rfd + objc2).
rfd = "=0.17.2"
# Outer Argon2id for vault password (exact pin matching Stronghold tree).
rust-argon2 = "=2.1.0"
hex = "=0.4.3"
anyhow = "=1.0.97"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
# PKCE S256
sha2 = "=0.10.8"
# Token material wipe-on-drop
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
# Cross-platform CSPRNG for PKCE / session ids (Task 2; no SecRandom FFI)
getrandom = "=0.4.3"
# Fixed-origin HTTPS for config + exchange (rustls only; no native-tls)
reqwest = { version = "=0.12.15", default-features = false, features = ["rustls-tls", "json"] }
# rt + time: production pending-PKCE async timer (shared runtime; no OS thread per login)
# sync: watch channel for durable cancellation generation (cloud_transport 6B1)
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
thiserror = "=1.0.69"

# macOS native secure input (NSSecureTextField) — library only; no WebView surface.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = ["NSWorkspace"] }
objc2-foundation = "=0.3.2"

# Windows native secure input (Win32 EDIT ES_PASSWORD / multiline) — no WebView surface.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux native secure input (GTK3 Dialog + Entry/TextView) — no WebView surface.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
