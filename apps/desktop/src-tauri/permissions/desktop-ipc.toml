# Task 10 — named application IPC only (WebView).
# Opener / deep-link / Stronghold stay Rust-only and must never appear here.
# Keep in sync with apps/admin/src/desktop/tauri-bridge.ts DESKTOP_IPC_COMMANDS.

[[permission]]
identifier = "allow-desktop-ipc"
description = "Allow only the named OpsMate desktop IPC commands for the main WebView"
commands.allow = [
  "auth_begin_logto",
  "auth_logout",
  "auth_session_status",
  "auth_on_unauthorized",
  "vault_status",
  "vault_init",
  "vault_unlock",
  "vault_lock",
  "vault_reset",
  "vault_import",
  "vault_list_meta",
  "vault_delete_local",
  "local_ssh_open",
  "local_ssh_write",
  "local_ssh_resize",
  "local_ssh_close",
  "cloud_terminal_open",
  "cloud_terminal_write",
  "cloud_terminal_resize",
  "cloud_terminal_close",
  "request_cloud_upload",
  "request_cloud_delete",
  "cloud_request",
  "open_external_route",
]
