# Port 80: default container port (Dokploy/Traefik should target this).
# Port 9000: fallback when Dokploy domain is mistakenly set to host-mapped 9000.
server {
    listen 80;
    listen 9000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stripe webhook signature header (CLI → admin:9000/api/billing/webhook)
        proxy_set_header Stripe-Signature $http_stripe_signature;
        proxy_pass_request_headers on;
        # Preserve raw body for Stripe signature verification
        proxy_request_buffering on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 2m;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}
